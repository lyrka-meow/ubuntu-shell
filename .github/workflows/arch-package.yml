name: Build Arch Linux package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  smoke-test:
    name: Test Ubuntu container
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Start Ubuntu Shell
        run: ./installer/ubuntu-shell start

      - name: Verify container
        run: |
          docker compose --project-name ubuntu-shell exec -T ubuntu bash -lc '
            test "$(id -un)" = ubuntu
            test "$PWD" = /home/ubuntu
            sudo -n true
            fastfetch --version
          '

      - name: Clean up container
        if: always()
        run: ./installer/ubuntu-shell clean

  package:
    name: Build .pkg.tar.zst
    needs: smoke-test
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm git github-cli
          printf '%s\n' \
            'PACKAGER="lyrka-meow <221443219+lyrka-meow@users.noreply.github.com>"' \
            >> /etc/makepkg.conf

      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate release version
        if: github.ref_type == 'tag'
        working-directory: packaging/arch
        run: |
          pkgver="$(bash -c 'source ./PKGBUILD; printf "%s" "$pkgver"')"
          test "v${pkgver}" = "$GITHUB_REF_NAME" || {
            echo "PKGBUILD version v${pkgver} does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          }

      - name: Build package
        id: build
        working-directory: packaging/arch
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- makepkg --cleanbuild --nodeps --noconfirm
          package_path="$(find "$PWD" -maxdepth 1 -type f \
            -name 'ubuntu-shell-*.pkg.tar.zst' -print -quit)"
          test -n "$package_path"
          test -f "$package_path"
          checksum_path="${package_path}.sha256"
          sha256sum "$(basename "$package_path")" > "$checksum_path"
          sha256sum --check "$checksum_path"
          echo "path=$package_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$package_path")" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Inspect package
        run: |
          package='${{ steps.build.outputs.path }}'
          pacman -Qip "$package"
          bsdtar -tf "$package" | grep -Fx 'usr/bin/ubuntu-shell'
          bsdtar -tf "$package" | grep -Fx 'usr/share/ubuntu-shell/Dockerfile'
          bsdtar -tf "$package" | grep -Fx 'usr/share/ubuntu-shell/compose.yaml'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: |
            ${{ steps.build.outputs.path }}
            ${{ steps.build.outputs.checksum_path }}
          if-no-files-found: error

      - name: Create GitHub Release and upload package
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Ubuntu Shell $GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            '${{ steps.build.outputs.path }}' \
            '${{ steps.build.outputs.checksum_path }}' \
            --clobber
